# Broker config for the link monitor.
# 1883: normal MQTT for mosquitto_sub and mosquitto_pub
# 9001: WebSockets, so the dashboard page in the browser can connect
# Both listen on this laptop only (127.0.0.1), so nothing on the Wi-Fi can reach them.
listener 1883 127.0.0.1
listener 9001 127.0.0.1
protocol websockets
allow_anonymous true

# Publish the broker's own log to $SYS/broker/log/... so the page can see who connects
log_dest topic
log_dest stdout
log_type all
