# Generated by scripts/make_carda_b_intake.py - SOP text only, no annotation timestamps.
customer:
  name: CarDA demo line, held-out recordings (subset B)
  product: car front door
  source: https://zenodo.org/records/14644367 (CC BY 4.0)
line:
  takt_s: 240
  paced: true
  shifts_per_day: 2
  hours_per_shift: 8
  days_per_year: 250
  hourly_wage_usd: null
cameras:
  calibration: file
  file: data/carda/cameras_calibration.xlsx
default_part:
  name: component
  mass_kg: 0.5
  precision_mm: 2.0
  basis: default estimate when a step names no known part
  flexible: false
stations:
- name: WS30
  conveyor:
    present: true
    polygon_xy: null
    direction_xy: null
  sop:
  - step: 1. Fixate speaker
    text: Fixate speaker
    activities:
    - Take the speaker from the cart
    - Insert it correctly into the retaining slots on the carrier
    - Take the screwdriver from the line side
    - Fix 4 screws on the speaker
    - Take screw from the pouch
    - Place 1 screw at a time on the screwdriver tip
    - Fixate screws at designated points
    - Leave screwdriver on the line side
  - step: 2. Fixate door panel
    text: Fixate door panel
    activities:
    - Take the door panel from the cart
    - Tilt the panel a bit
    - Approach it on the door frame
    - With both hands hook the superior part of the door panel on the door frame (inferior part of the window)
    - Take the screwdriver from the line side
    - Fix the panel on the door handle area
    - Take 1 screw from the pouch
    - Place the screw on the screwdriver tip
    - Fixate screw at designated point
    - Fix the panel on the window lifter area
    - Leave the screwdriver on the line side
    - Fix the door panel on the posterior area
    - Take 2 screws from the pouch
    - Place 1 screw at a time on the screwdriver tip
    - Leave screwdriver on the line side
  - step: 3. Fixate window control panel
    text: Fixate window control panel
    activities:
    - Navigate to door parts tray
    - Pick up window control panel
    - Navigate to WS location
    - Take rear part of the window control panel from the cart
    - Take front part of the window control panel from the cart
    - Navigate to hand-over position
    - Hand over window control panel to user
    - Take component from robot (release the component from gripper)
    - Manually join the components
    - Insert the components into the slot on the door panel
    - Push manually the components to hook them on the door panel
    - Take the screwdriver from the line side
    - Fixate components
    - Take 1 screw from the pouch
    - Place the screw on the screwdriver tip
    - Fixate screw at designated point
    - Leave the screwdriver on the line side
    - Fixate plug
    - Take plug from the cart
    - Place the plug in its position near the window control panel
  - step: 4. Fixate speaker frame
    text: Fixate speaker frame
    activities:
    - Take speaker frame from the cart
    - Manually position the speaker frame in its seat on the door panel
    - Insert, through manual pressure, first the centering pin
    - Trigger n 8 pinetti on flange into the holes door panel
  - step: 5. Adjust WS
    text: Adjust WS
    activities:
    - Move to working position at the WS
    - Adjust AWS to user-defined working height
    - Manually adjust WS to working height
  - step: 6. Fixate anti-vibration pad
    text: Fixate anti-vibration pad
    activities:
    - Take the anti-vibration pad and 1 insertion tool from the box from the box on the cart
    - Insert the tools centering pin in the hollow part of the pad
    - Using the tool and manual pressure, insert the plug into the hole on the inner frame of the upper area of the door frame
    - Remove the tool and place it in the pouch
  - step: 7. Move cart
    text: Move cart
    activities:
    - Reach the front cart area
    - Unlock 1 + 1 front wheels
    - Push the cart until it is out of the line
    - Move the cart near the AGV loading area and hook the cart on the AGV or on the other cart
    - Move to the next cart
  parts:
  - name: door speaker (165 mm woofer)
    keywords:
    - speaker
    mass_kg: 0.8
    precision_mm: 1.0
    basis: 'estimate: 6.5-in automotive door woofers ~0.5-1.0 kg'
    flexible: false
  - name: speaker frame / grille ring
    keywords:
    - speaker frame
    - frame
    mass_kg: 0.1
    precision_mm: 1.0
    basis: 'estimate: moulded plastic ring <0.15 kg'
    flexible: false
  - name: interior door trim panel
    keywords:
    - door panel
    mass_kg: 2.5
    precision_mm: 2.0
    basis: 'estimate: injection-moulded door trim panels ~2-4 kg'
    flexible: false
  - name: window control switch panel
    keywords:
    - window control
    mass_kg: 0.2
    precision_mm: 1.0
    basis: 'estimate: switch bezel + connector ~0.1-0.3 kg'
    flexible: false
  - name: anti-vibration pad
    keywords:
    - anti-vibration
    - pad
    mass_kg: 0.05
    precision_mm: 3.0
    basis: 'estimate: foam/butyl pad <0.1 kg'
    flexible: true
