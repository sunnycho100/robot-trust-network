# Generated by scripts/make_carda_intake.py - no timestamps from the annotation are included.
customer:
  name: CarDA demo line (Stellantis CRF, Melfi)
  product: car front door
  source: https://zenodo.org/records/14644367 (CC BY 4.0)
line:
  takt_s: 240
  paced: true
  shifts_per_day: 2
  hours_per_shift: 8
  days_per_year: 250
  hourly_wage_usd: null
cameras:
  calibration: file
  file: data/carda/cameras_calibration.xlsx
default_part:
  name: component
  mass_kg: 0.5
  precision_mm: 2.0
  basis: default estimate when the subgoal names no known part
  flexible: false
stations:
- name: WS10
  conveyor:
    present: true
    polygon_xy: null
    direction_xy: null
  sop:
  - step: 1. Place cart
    text: Place cart
    activities:
    - 1.1 Move cart towards the line, following the ground signs
    - 1.2 Position dolly cart at the line - anterior wheels are on the line
    - 1.3 Lock right front wheel
    - 1.4 Lock left front wheel
  - step: 2. WS adjustment
    text: WS adjustment
    activities:
    - 2.1 Move to working position at the WS
    - 2.2 Adjust AWS to user-defined working height
    - 2.3 Manually adjust WS to working height
  - step: 3. Fixate glass front door
    text: Fixate glass front door
    activities:
    - 3.1 Navigate to tool station
    - 3.2 Pick up screwdriver from the tool station
    - 3.3 Navigate to WS location
    - 3.4 Take component from the cart
    - 3.5 Tilt component and Insert component in the internal door channel
    - 3.6 Push component towards the anterior door side
    - 3.7 Manually fit internal door gasket on sheet metal edge
    - 3.8 Navigate to hand-over position
    - 3.9 Hand over screwdriver to user
    - 3.10 Take screwdriver from robot (release the tool from gripper & move arm to parkpos)
    - 3.11 Navigate to WS location
    - 3.12 Take the screwdriver 1 from the line side
    - 3.13 Fix superior part of the component
    - 3.13.1 Take 1 screw from the pouch
    - 3.13.2 Place screw on the screwdriver tip
    - 3.13.3 Mount screw in position
    - 3.14 Fix inferior part of the component
    - 3.14.1 Move around the cart
    - 3.14.2 Take 1 screw from the pouch
    - 3.14.3 Place screw on the screwdriver tip
    - 3.14.4 Mount screw in position
    - 3.15 Navigate to hand-over position
    - 3.16 Extend robot arm for take back
    - 3.17 Take screwdriver from user
    - 3.18 Navigate to WS location
  - step: 4. Fixate weather strip front door belt end
    text: Fixate weather strip front door belt end
    activities:
    - 4.1 Take the component from the cart
    - 4.2 Manually put it on the glass sliding seat in the belt line area, starting from the front door area
    - 4.3 Place the flocked lip of the gasket that must go in contact with the glass
    - 4.4 Insert the gasket into the groove of “voletto”
    - 4.5 Using manual pressure (e.g., hammer), slide the gasket onto the door sheet along its entire length, up to the B
      pillar
    - 4.6 Check the correct alignment between the gasket and the door sheet from the front door area to the B pillar
  - step: 5. Fixate posterior vertical coverage
    text: Fixate posterior vertical coverage
    activities:
    - 5.1 Take component from the cart
    - 5.2 Manually position component
    - 5.3 Check position of component
    - 5.4 Align upper profile of the panel with the gasket by moving it in Z and make sure hook is correctly positioned
    - 5.5 Navigate to hand-over position
    - 5.6 Hand over screwdriver to user
    - 5.7 Take screwdriver from robot (release the tool from gripper & move arm to parkpos)
    - 5.8 Navigate to WS location
    - 5.9 Fix component starting from the bottom
    - 5.9.1 Take N 3 screw from the pouch
    - 5.9.2 Place the screws on the screwdriver tip, insert one at a time
    - 5.9.3 Fix the panel starting from the bottom
    - 5.10 Navigate to hand-over position
    - 5.11 Extend robot arm for take back
    - 5.12 Take screwdriver from user
    - 5.13 Navigate to the tool station
    - 5.14 Place the screwdriver into the tool station
    - 5.15 Return screwdriver to tool station
  parts:
  - name: glass run channel / door glass component
    keywords:
    - glass
    mass_kg: 0.6
    precision_mm: 2.0
    basis: 'estimate: channel + gasket component, ~0.3-1 kg'
    flexible: true
  - name: belt-line weather strip
    keywords:
    - weather strip
    mass_kg: 0.2
    precision_mm: 2.0
    basis: 'estimate: EPDM strip ~0.1-0.3 kg'
    flexible: true
  - name: posterior vertical trim cover
    keywords:
    - vertical coverage
    mass_kg: 0.3
    precision_mm: 1.0
    basis: 'estimate: plastic trim ~0.2-0.4 kg'
    flexible: false
- name: WS20
  conveyor:
    present: true
    polygon_xy: null
    direction_xy: null
  sop:
  - step: 1. Adjust WS
    text: Adjust WS
    activities:
    - 1.1 Adjust AWS to user-defined working height
    - 1.2 Manually adjust WS to working height
  - step: 2. Fixate rearview mirror
    text: Fixate rearview mirror
    activities:
    - 2.1 Get screwdriver from tool station
    - 2.2 Move to designated side for assembly (right)
    - 2.3 Navigate to tool station
    - 2.4 Pick up screwdriver from the tool station
    - 2.5 Navigate to WS location
    - 2.6 Navigate to hand-over position
    - 2.7 Hand over screwdriver to user
    - 2.8 Take screwdriver from robot (release the tool from gripper & move arm to parkpos)
    - 2.9 Navigate to WS location
    - 2.10 Take 3 screws from the pouch
    - 2.10.1 Tight the 3 screws following the sequence shown in the figure
    - 2.11 Navigate to hand-over position
    - 2.12 Extend robot arm for take back
    - 2.13 Take screwdriver from user
    - 2.14 Navigate to tool station
    - 2.15 Place the screwdriver into the tool station
    - 2.16 Pick up screwdriver from the tool station
    - 2.17 Navigate to WS location
    - 2.19 Return screwdriver to tool station
    - 2.20 Pick up screwdriver from the tool station
    - 2.21 Find and pull out the connectors of the wire previously inserted from the upper hole of the door
  - step: 3. Fixate tie rod
    text: Fixate tie rod
    activities:
    - 3.1 Take tie rod from the cart
    - 3.2 Insert it from the hole of the frame of the door with the left hand
    - 3.3 Rotate it 90 degrees
    - 3.4 Pass the pins of the tie through the corresponding holes on the door pillar
    - 3.5 Screw 2 nuts
    - 3.5.1 Take the 2 nuts from the pouch
    - 3.5.2 Start screwing the nuts manually
    - 3.6 Navigate to hand-over position
    - 3.7 Hand over screwdriver to user
    - 3.8 Take screwdriver from robot (release the tool from gripper)
    - 3.9 Navigate to WS location
    - 3.10 Complete the screw of the 2 nuts
    - 3.11 Navigate to hand-over position
    - 3.12 Extend robot arm for take back
    - 3.13 Take screwdriver from user
    - 3.14 Navigate to WS location
  - step: 4. Fixate plugs
    text: Fixate plugs
    activities:
    - 4.1 Take 2 plugs from the cart
    - 4.2 Insert it from the hole of the frame of the door with the left hand
  - step: 5. Fixate carrier
    text: Fixate carrier
    activities:
    - 5.1 Take the carrier from the cart
    - 5.2 Grasp the carrier with the right hand in the speaker area and the left hand in the lower area
    - 5.3 Place the lock system in the appropriate seat inside the door
    - 5.4 Insert the window lifter slide inside the door frame
    - 5.4.1 Slightly rotate the carrier
    - 5.4.2 Attach completely on the door frame
    - 5.5 Take the ring nut locking tool from the line side
    - 5.6 Respecting the fixing sequence, rotate the ring nut to the stop in correspondence with the reference notch indicated
      for each single ring nut
    - 5.7 Leave the ring nut locking tool in the line pouch
    - 5.8 Navigate to hand-over position
    - 5.9 Hand over screwdriver to user
    - 5.10 Take screwdriver from robot (release the tool from gripper)
    - 5.11 Navigate to WS location
    - 5.12 Fix nut
    - 5.12.1 Take 2 nuts from the pouch
    - 5.12.2 Place the first nut on the tip of the screwdriver and screw it above carrier area
    - 5.12.3 Place the second nut on the tip of the screwdriver and screw it on the rear left carrier
    - 5.13 Navigate to hand-over position
    - 5.14 Extend robot arm for take back
    - 5.15 Take screwdriver from user
    - 5.16 Navigate to tool station
    - 5.17 Place the screwdriver into the tool station
    - 5.18 Pick up screwdriver from the tool station
    - 5.19 Navigate to WS location
    - 5.20 Return screwdriver to tool station
    - 5.21 Pick up screwdriver from the tool station
    - 5.22 Align holes of the door frame with the holes of the lock system
    - 5.22.1 Take the centering tool from the pouch and aligne carrier from rearside
    - 5.22.2 Leave/return centering tool in the pouch
    - 5.23 Navigate to hand-over position
    - 5.24 Hand over screwdriver to user
    - 5.25 Take screwdriver from robot (release the tool from gripper)
    - 5.26 Navigate to WS location
    - 5.27 Fix the screws
    - 5.28 Take 3 screws from the pouch
    - 5.29 Place 1 screw at a time on the screwdriver tip
    - 5.30 Navigate to hand-over position
    - 5.31 Extend robot arm for take back
    - 5.32 Take screwdriver from user
    - 5.33 Navigate to tool station
    - 5.34 Place the screwdriver into the tool station
    - 5.35 Return screwdriver to tool station
  parts:
  - name: door speaker (165 mm woofer)
    keywords:
    - speaker
    mass_kg: 0.8
