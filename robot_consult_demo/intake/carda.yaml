    mass_kg: 1.3
    precision_mm: 1.0
    basis: 'estimate: power-folding door mirror assemblies ~1.0-1.6 kg'
    flexible: false
  - name: lock tie rod
    keywords:
    - tie rod
    mass_kg: 0.15
    precision_mm: 1.0
    basis: 'estimate: steel rod with clips, <0.2 kg'
    flexible: false
  - name: hole plugs
    keywords:
    - plug
    mass_kg: 0.01
    precision_mm: 2.0
    basis: 'estimate: rubber/plastic plugs'
    flexible: false
  - name: window-regulator / door-module carrier
    keywords:
    - carrier
    mass_kg: 2.5
    precision_mm: 1.0
    basis: 'estimate: door-module carriers with regulator ~2-3.5 kg'
    flexible: false
- name: WS30
  conveyor:
